<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Website</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<style>
    /* Remove blank space around the page */
    body,
    html {
        margin: 0;
        padding: 0;
        height: 100%;
    }

    .myTable {
        background-color: burlywood;
        border-spacing: 30px;
        margin-left: auto;
        margin-right: auto;
    }

    #container {
        display: grid;
        grid-template-columns: 8em 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
            "header header"
            "left main"
            "footer footer";
        height: 100vh;
    }

    #headerMain {
        grid-area: header;
        background-color: steelblue;
        text-align: left;
        padding: 10px;
    }

    /*
    #headerFavorites {
        grid-area: header;
        background-color: steelblue;
        text-align: left;
        padding: 10px;
    }

    #headerList {
        grid-area: header;
        background-color: steelblue;
        text-align: left;
        padding: 10px;
    }
    */

    #leftMenu {
        grid-area: left;
        background-color: skyblue;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 10px;

    }

    #contentMainCell {
        grid-area: main;
        background-color: burlywood;
        text-align: center;
        list-style-position: inside;
        padding: 0;
        margin: 0;
    }

    /*
    #contentFavoritesCell {
        grid-area: main;
        background-color: burlywood;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    #contentFavoritesCell ul{
        list-style-position: inside;
        padding: 0;
        margin: 0;
    }

    #contentListCell {
        grid-area: main;
        background-color: burlywood;
        text-align: center;
    }
    */
    #footer {
        grid-area: footer;
        background-color: steelblue;
        text-align: right;
        padding: 10px;
    }

    .underlined {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        #container {
            grid-template-columns: 10em 1fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "header header"
                "main main"
                "footer footer";
        }

        #leftMenu {
            display: none;
        }
    }
</style>

<body onload="showContent('contentMain')">
    <!-- About Me Header, default header -->
    <div id="container">
        <div id="headerMain">
            <h1> About Me </h1>
        </div>

        <div id="contentMainCell"></div>

        <div id="leftMenu">
            <p class="underlined" onclick="showContent('contentMain')"> About Me </p>
            <p onclick="showContent('contentFavorites')"> Favorites </p>
            <p onclick="showContent('contentList')"> List </p>
        </div>

        <div id="footer">
            <p> Kyle's Website &copy; </p>
        </div>
    </div>
    <script>
        function showContent(contentId) {
            /*****
            // Using object literals to store headers and content cells
            const headers = {
                contentMain: 'About Me',
                contentFavorites: 'Favorite Websites',
                contentList: 'Places that I\'ve visited'
            };

            const contentCells = {
                contentMain: 'contentMainCell',
                contentFavorites: 'contentFavoritesCell',
                contentList: 'contentListCell'
            };

            // Update header
            // Locate and map to the default header ID, headerMain
            const headerElement = document.querySelector(`#headerMain`);
            if (headerElement) {
                // Within the headers object, find the key that matches the contentId
                headerElement.innerHTML = `<h1>${headers[contentId]}</h1>`;
            }
            *****/

            // Fetch and update content
            fetch(`${contentId}.html`)
                .then(response => response.text())
                .then(data => {
                    // All three content cells have an id that starts with 'content'
                    const contentElement = document.querySelector('#contentMainCell');
                    contentElement.innerHTML = data;
                })
                .catch(error => console.error('Error fetching content:', error));

            const menuItems = document.querySelectorAll('#leftMenu p');
            menuItems.forEach(item => {
                if (item.getAttribute('onclick') === `showContent('${contentId}')`) {
                    item.classList.add('underlined');
                }
                else {
                    item.classList.remove('underlined');
                }
            });
        }

        // Ensure the default choice is underlined on page load
        document.addEventListener('DOMContentLoaded', () => {
            showContent('contentMain');
        });
    </script>
</body>

</html>
