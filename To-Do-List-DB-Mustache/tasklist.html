<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link href="style.css" rel="stylesheet">
</head>
 
<body>
    <h1>My To Do List</h1>
    <div id = "taskContainer"></div>
    <div>
        <input type="text" class="taskInput" id="task" placeholder="Enter a task" size="25" autofocus>
    </div>
    <div>
        <button onclick="addTask()" class="taskButton">Add Task</button>
    </div>
    <script id="taskTemplate" type="text/template">
        <form>
            <ul id="taskListID">
                {{#tasks}}
                <li>{{task}}</li>
                {{/tasks}}
            </ul>
        </form>
    </script>
</body>
 
</html>
