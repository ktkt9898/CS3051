<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <link href="style.css" rel="stylesheet">
</head>
 
<body>
    <h1>My To Do List</h1>
    <div>
        <form>
            <ul id="taskListID">
            </ul>
        </form>
    </div>
    <div>
        <input type="text" class="taskInput" id="task" placeholder="Enter a task" size="25" autofocus>
    </div>
    <div>
        <button onclick="addTask()" class="taskButton">Add Task</button>
    </div>
    <script src="script.js" async defer></script>
</body>
 
</html>
