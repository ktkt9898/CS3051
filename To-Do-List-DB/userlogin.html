<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <script>
        async function addUser() {
            const name = document.getElementById("username").value;
            const response = await fetch("/add-user", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            });
            const result = await response.json();
            alert(result.error || `User added with ID: ${result.id}`);
        }

        async function listUsers() {
            const response = await fetch("/list-users");
            const users = await response.json();
            const userList = document.getElementById("user-list");
            userList.innerHTML = ""; // Clear existing list
            users.forEach(user => {
                const userItem = document.createElement("li");
                userItem.textContent = `${user.id}: ${user.name}`;
                const viewTasksButton = document.createElement("button");
                viewTasksButton.textContent = "View Tasks";
                viewTasksButton.onclick = () => viewTasks(user.id);
                userItem.appendChild(viewTasksButton);
                userList.appendChild(userItem);
            });
        }

        async function viewTasks(userId) {
            // Send a GET request to fetch tasks for the selected user
            const response = await fetch(`/get-tasks/${userId}`);

            // Store the array of tasks for the selected user
            const tasks = await response.json();

            // Direct taskList to the id of task-list
            const taskList = document.getElementById("task-list");
            taskList.innerHTML = ""; // Clear existing tasks
            tasks.forEach(task => {
                const taskItem = document.createElement("li");
                // Create a delete button, to be used along with the task
                let deleteButton = document.createElement('button');
                deleteButton.id = 'deleteButton';
                deleteButton.className = 'deleteButton';
                deleteButton.textContent = "X";
                deleteButton.onclick = async function () {
                    try {
                        // Send a DELETE request to the backend to remove the task from the database
                        const response = await fetch(`/delete-task/${task.id}`, {
                            method: "DELETE",
                        });

                        const result = await response.json();
                        if (result.error) {
                            alert(result.error);
                        } else {
                            // Remove the task item from the UI if the deletion was successful
                            taskList.removeChild(taskItem);
                        }
                    } catch (error) {
                        console.error("Error deleting task:", error);
                        alert("Failed to delete task");
                    }
                };

                // Create a checkbox, to be used along with the task
                let checkBox = document.createElement('input');
                checkBox.type = 'checkbox';
                checkBox.id = 'checkBox';
                checkBox.className = 'checkBox';
                checkBox.onclick = function() {
                    if (checkBox.checked) {
                        taskItem.style.textDecoration = 'line-through';
                    } else {
                        taskItem.style.textDecoration = 'none';
                    }
                }
                taskItem.textContent = task.task;
                taskList.appendChild(taskItem);
                taskItem.appendChild(checkBox);
                taskItem.appendChild(deleteButton);
            });

            // Make the add task section visible
            document.getElementById("add-task-section").style.display = "block";
            document.getElementById("task-user-id").value = userId;
        }

        async function addTask() {
            const userId = document.getElementById("task-user-id").value;
            const task = document.getElementById("task").value;
            const response = await fetch("/add-task", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, task })
            });
            const result = await response.json();
            alert(result.error || `Task added with ID: ${result.id}`);
        }
    </script>
</head>
<body>
    <h1>To-Do List</h1>

    <section>
        <h2>Add User</h2>
        <input type="text" id="username" placeholder="Enter user name">
        <button onclick="addUser()">Add User</button>
    </section>

    <section>
        <h2>Users</h2>
        <button onclick="listUsers()">List Users</button>
        <ul id="user-list"></ul>
    </section>

    <section id="add-task-section" style="display: none;">
        <h2>Add Task</h2>
        <input type="hidden" id="task-user-id">
        <input type="text" id="task" placeholder="Enter task">
        <button onclick="addTask()">Add Task</button>
    </section>

    <section>
        <h2>Tasks</h2>
        <ul id="task-list"></ul>
    </section>
</body>
</html>
