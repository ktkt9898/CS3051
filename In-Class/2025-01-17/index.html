<!DOCTYPE html>
<!-- Html, head, body, are the basic structures of an HTML file-->
<html>

<head>
    <!-- CSS, will go over later-->
    <style>
        kyle {
            color: red;
        }
    </style>

</head>

<body>
    <!-- Header tag, where 1-6 specify the size-->
    <h1>CS-3051</h1>
    <h2>SPR25</h2>
    <!-- Individual block divider tag-->
    <!-- Attribute can be inside the tag-->
    <!-- an ID attribute can be referenced later using CSS
         only 1 ID attribute can exist for a 1 element-->
    <!-- a class can be used for as many elements as required
          and can have styles applied to the entire grouping/class-->
    <div id="div1" class="my-nice-divs">
        Hello class
    </div>
    <div class="my-nice-divs">
        <!-- specific for CSS, but any tag with the name kyle can have attributes/styles applied-->
        <kyle>It's friday</kyle>
        <!-- break, separates lines, does not need a closing tag-->
        <br>
        This is a line
        <br>
        <!-- &nbsp makes a break on the same line, can be used multiple times-->
        And this is another &nbsp; line
        <br>
        <!-- image sources should have the relative path, not the entire locally stored computer path,
             in this case the path to the images folder containing the image-->
        <img src="wikipedia.png">
    </div>
</body>

</html>
