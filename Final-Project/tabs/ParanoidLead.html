<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paranoid Rhythm</title>
    <link href="style.css" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: auto;
        }

        img {
            width: 100%; /* Increase the width to ensure scroll bars */
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
        }

        .image-container {
            position: relative;
            margin: 0;
            padding: 0;
        }

        .shape {
            width: 100px; /* Set the width to match the desired size */
            height: 100px; /* Set the height to match the desired size */
            background-color: red; /* Set the background color to red */
            position: absolute; /* Ensure the shape is positioned correctly */
        }

        #oneTempoChange {
            top: 0px;
            left: 0;
        }

        #twoTempoChange {
            top: 650px;
            left: 0;
        }

        #threeTempoChange {
            top: 1300px;
            left: 0;
        }
    </style>
</head>
<body>
    <img src="scores/Paranoid/Paranoid-Lead-1.png" alt="Tab Not Available">
    <img src="scores/Paranoid/Paranoid-Lead-2.png" alt="Tab Not Available">
    <img src="scores/Paranoid/Paranoid-Lead-3.png" alt="Tab Not Available">
</body>
</html>
