<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favorites</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <h1 class="mainHeader">
        Favorites
        <button id="buttonLogout" style="display: none;">Logout</button>
    </h1>

    <div id="warning" style="display: none;">
        Your screen width is too small for optimal viewing.
        <button id="buttonWarningClose">Close</button>
    </div>

    <nav class="mainNav">
        <ul>
            <li><a href="/login">Log In</a></li>
            <li><a href="/catalog">Catalog</a></li>
            <li><a href="/gallery">Gallery</a></li>
        </ul>
    </nav>

    <!-- Not Logged In Message -->
    <div id="not-logged-in">
        <h2>You are not logged in</h2>
    </div>

    <!-- No Favorites Message -->
    <div id="no-favorites" style="display: none;">
        <h2>No Favorites</h2>
    </div>

    <!-- List Favorites -->
    <div id="favorites-section" class="favorites-container" style="display: none;">
        <h2>Your Favorites</h2>
        <ul id="favorites-list">
            <!-- Favorites will be dynamically added here -->
        </ul>
    </div>

    <script src="scriptLogin.js"></script>
    <script src="scriptLogout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if the user is logged in
            const token = localStorage.getItem('token');
            if (!token) {
                // If no token, show "You are not logged in" message
                document.getElementById('not-logged-in').style.display = 'block';
                document.getElementById('favorites-section').style.display = 'none';
            } else {
                // If token exists, load favorites
                loadFavorites();
                document.getElementById('logoutButton').style.display = 'inline-block';
            }
        });
    </script>
</body>

</html>
