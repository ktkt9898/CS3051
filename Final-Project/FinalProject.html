<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Guitar Tabs</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- First tab -->
    <h1 class="mainHeader"> Guitar Tabs </h1>

    <div id="warning" class="hidden">
        Your screen dimensions are too small!
        <button id="close-btn">Close</button>
    </div>

    <div class="containerMusicTrack">
        <h3>Stairway to Heaven</h3>
        <h4>Led Zeppelin</h4>
        <h4>1971</h4>
        <style>
            #albumCoverStairway {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverStairway" src="albumCovers/Led_Zeppelin_IV.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Lead" onclick="toggleIframeAndButtons('iframeStairwayLead', 'innerButtonContainerStairwayLead', this)">Lead</button>
            <!--Split Lead and Rhythm buttons into 2 containers-->
            <div id="innerButtonContainerStairwayLead" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeStairwayLead', 1, 'audioStairway', [
                    { time: 2000, speed: 0.5 },
                    { time: 6000, speed: 2}
                ])">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling('audioStairway')">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeStairwayLead', 'audioStairway')">Reset</button>
            </div>
        </div>
        <iframe id="iframeStairwayLead" class="containerIFrame" src="tabs/StairwayLead.html" alt="Tab Is Not Available"></iframe>
        <audio id="audioStairway" src="backing-tracks/Stairway.wav"></audio>
    </div>

    <div class="containerMusicTrack">
        <h3>Paranoid</h3>
        <h4>Black Sabbath</h4>
        <h4>1970</h4>
        <style>
            #albumCoverParanoid {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverParanoid" src="albumCovers/Black_Sabbath_-_Paranoid.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Rhythm" onclick="toggleIframeAndButtons('iframeParanoidRhythm', 'innerButtonContainerParanoidRhythm', this)">Rhythm</button>
            <button class="buttonShow" data-original-text="Lead" onclick="toggleIframeAndButtons('iframeParanoidLead', 'innerButtonContainerParanoidLead', this)">Lead</button>
            <!-- Rhythm -->
            <div id="innerButtonContainerParanoidRhythm" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeParanoidRhythm', 0.5, 'rhythmParanoid', [
                    { tempoChangePageID: 'oneTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'twoTempoChange', tempoChangeSpeed: 0.5 },
                    { tempoChangePageID: 'threeTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'fourTempoChange', tempoChangeSpeed: 0.5 },
                    { tempoChangePageID: 'fiveTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'sixTempoChange', tempoChangeSpeed: 0.5 },
                    { tempoChangePageID: 'sevenTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'eightTempoChange', tempoChangeSpeed: 0.5 }
                ])">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling('rhythmParanoid')">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeParanoidRhythm', 'rhythmParanoid')">Reset</button>
            </div>

            <!-- Lead -->
            <div id="innerButtonContainerParanoidLead" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeParanoidLead', 0.8, 'leadParanoid', [
                    { tempoChangePageID: 'oneTempoChange', tempoChangeSpeed: 0.8 }
                ])">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling('leadParanoid')">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeParanoidLead', 'leadParanoid')">Reset</button>
            </div>
        </div>

        <!-- iFrames -->
        <iframe id="iframeParanoidRhythm" class="containerIFrame" src="tabs/ParanoidRhythm.html" alt="Tab Is Not Available"></iframe>
        <iframe id="iframeParanoidLead" class="containerIFrame" src="tabs/ParanoidLead.html" alt="Tab Is Not Available"></iframe>

        <!-- Audio -->
        <audio id="rhythmParanoid" src="backing-tracks/Paranoid-Rhythm.wav"></audio>
        <audio id="leadParanoid" src="backing-tracks/Paranoid-Lead.wav"></audio>
    </div>
    <script src="script.js" async defer></script>
</body>

</html>
