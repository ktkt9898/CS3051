<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Guitar Tabs</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- Your web page content goes here -->
    <h1 class="mainHeader"> Guitar Tabs </h1>

    <div id="warning" class="hidden">
        Your screen dimensions are too small!
        <button id="close-btn">Close</button>
    </div>

    <div class="containerMusicTrack">
        <h3>Stairway to Heaven</h3>
        <h4>Led Zeppelin</h4>
        <h4>1971</h4>
        <style>
            #albumCoverStairway {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverStairway" src="albumCovers/Led_Zeppelin_IV.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Lead" onclick="toggleIframeAndButtons('iframeStairwayLead', 'innerButtonContainerStairwayLead', this)">Lead</button>
            <button class="buttonShow" data-original-text="Rhythm" onclick="toggleIframeAndButtons('iframeStairwayRhythm', 'innerButtonContainerStairwayRhythm', this)">Rhythm</button>
            <!--Split Lead and Rhythm buttons into 2 containers-->
            <div id="innerButtonContainerStairwayLead" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeStairwayLead', 0.7)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeStairwayLead')">Reset</button>
            </div>

            <div id="innerButtonContainerStairwayRhythm" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeStairwayRhythm', 1.2)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeStairwayRhythm')">Reset</button>
            </div>
        </div>
        <iframe id="iframeStairwayLead" class="containerIFrame" src="tabs/StairwayLead.html" alt="Tab Is Not Available"></iframe>
        <iframe id="iframeStairwayRhythm" class="containerIFrame" src="tabs/StairwayRhythm.html" alt="Tab Is Not Available"></iframe>
    </div>

    <div class="containerMusicTrack">
        <h3>One</h3>
        <h4>Metallica</h4>
        <h4>1988</h4>
        <style>
            #albumCoverOne {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverOne" src="albumCovers/Metallica_-_...And_Justice_for_All_cover.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Lead" onclick="toggleIframeAndButtons('iframeOneLead', 'innerButtonContainerOneLead', this)">Lead</button>
            <button class="buttonShow" data-original-text="Rhythm" onclick="toggleIframeAndButtons('iframeOneRhythm', 'innerButtonContainerOneRhythm', this)">Rhythm</button>
            <div class="containerButton">
                <!--Split Lead and Rhythm buttons into 2 containers-->
                <div id="innerButtonContainerOneLead" class="containerInnerButtons" style="display: none;">
                    <button class="buttonsInner" onclick="startScrolling('iframeOneLead', 0.2, [
                    { tempoChangePageID: 'firstTempoChange', tempoChangeSpeed: 1.5 },
                    { tempoChangePageID: 'secondTempoChange', tempoChangeSpeed: 0.5 },
                    { tempoChangePageID: 'thirdTempoChange', tempoChangeSpeed: 1.5 },
                    { tempoChangePageID: 'fourthTempoChange', tempoChangeSpeed: 0.5 },
                    { tempoChangePageID: 'fifthTempoChange', tempoChangeSpeed: 1.5 },
                    { tempoChangePageID: 'sixthTempoChange', tempoChangeSpeed: 2.0 },
                    { tempoChangePageID: 'seventhTempoChange', tempoChangeSpeed: 3.5 }
                ])">Start</button>
                    <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                    <button class="buttonsInner" onclick="resetScrolling('iframeOneLead')">Reset</button>
                </div>
                
                <div id="innerButtonContainerOneRhythm" class="containerInnerButtons" style="display: none;">
                    <button class="buttonsInner" onclick="startScrolling('iframeOneRhythm', 0.7, 'OnePg13', 1.5)">Start</button>
                    <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                    <button class="buttonsInner" onclick="resetScrolling('iframeOneRhythm')">Reset</button>
                </div>
            </div>
        </div>
        <iframe id="iframeOneLead" class="containerIFrame" src="tabs/OneLead.html" alt="Tab Is Not Available"></iframe>
        <iframe id="iframeOneRhythm" class="containerIFrame" src="tabs/OneRhythm.html" alt="Tab Is Not Available"></iframe>
    </div>

    <div class="containerMusicTrack">
        <h3>Paranoid</h3>
        <h4>Black Sabbath</h4>
        <h4>1970</h4>
        <style>
            #albumCoverParanoid {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverParanoid" src="albumCovers/Black_Sabbath_-_Paranoid.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Lead" onclick="toggleIframeAndButtons('iframeParanoidLead', 'innerButtonContainerParanoidLead', this)">Lead</button>
            <!--Split Lead and Rhythm buttons into 2 containers-->
            <div id="innerButtonContainerParanoidLead" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeParanoidLead', 1.25)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeParanoidLead')">Reset</button>
            </div>
        </div>
        <iframe id="iframeParanoidLead" class="containerIFrame" src="tabs/ParanoidLead.html" alt="Tab Is Not Available"></iframe>
    </div>
    <script src="script.js" async defer></script>
</body>

</html>
