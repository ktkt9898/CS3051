<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Guitar Tabs</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- Your web page content goes here -->
    <h1 class="mainHeader"> Guitar Tabs </h1>

    <div id="warning" class="hidden">
        Your screen dimensions are too small!
        <button id="close-btn">Close</button>
    </div>

    <div class="containerMusicTrack">
        <h3>Stairway to Heaven</h3>
        <h4>Led Zeppelin</h4>
        <h4>1971</h4>
        <style>
            #albumCoverStairway {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverStairway" src="albumCovers/Led_Zeppelin_IV.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Lead" onclick="toggleIframeAndButtons('iframeStairwayLead', 'innerButtonContainerStairwayLead', this)">Lead</button>
            <button class="buttonShow" data-original-text="Rhythm" onclick="toggleIframeAndButtons('iframeStairwayRhythm', 'innerButtonContainerStairwayRhythm', this)">Rhythm</button>
            <!--Split Lead and Rhythm buttons into 2 containers-->
            <div id="innerButtonContainerStairwayLead" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeStairwayLead', 0.7)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeStairwayLead')">Reset</button>
            </div>

            <div id="innerButtonContainerStairwayRhythm" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeStairwayRhythm', 1.2)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeStairwayRhythm')">Reset</button>
            </div>
        </div>
        <iframe id="iframeStairwayLead" class="containerIFrame" src="tabs/StairwayLead.html" alt="Tab Is Not Available"></iframe>
        <iframe id="iframeStairwayRhythm" class="containerIFrame" src="tabs/StairwayRhythm.html" alt="Tab Is Not Available"></iframe>
    </div>

    <div class="containerMusicTrack">
        <h3>One</h3>
        <h4>Metallica</h4>
        <h4>1988</h4>
        <style>
            #albumCoverOne {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverOne" src="albumCovers/Metallica_-_...And_Justice_for_All_cover.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Rhythm" onclick="toggleIframeAndButtons('iframeOneRhythm', 'innerButtonContainerOneRhythm', this)">Rhythm</button>
            <div class="containerButton">
                <!--Split Lead and Rhythm buttons into 2 containers-->
                <div id="innerButtonContainerOneRhythm" class="containerInnerButtons" style="display: none;">
                    <button class="buttonsInner" onclick="startScrolling('iframeOneRhythm', 0.8, 'audioOne', [
                    { tempoChangePageID: 'oneTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'twoTempoChange', tempoChangeSpeed: 0.8 },
                    { tempoChangePageID: 'threeTempoChange', tempoChangeSpeed: 1.2 },
                    { tempoChangePageID: 'fourTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'fiveTempoChange', tempoChangeSpeed: 1.2 },
                    { tempoChangePageID: 'sixTempoChange', tempoChangeSpeed: 1.0 }
                ])">Start</button>
                    <button class="buttonsInner" onclick="pauseScrolling('audioOne')">Pause</button>
                    <button class="buttonsInner" onclick="resetScrolling('iframeOneRhythm', 'audioOne')">Reset</button>
                </div>
            </div>
        </div>
        <iframe id="iframeOneRhythm" class="containerIFrame" src="tabs/OneRhythm.html" alt="Tab Is Not Available"></iframe>
        <audio id="audioOne" src="backing-tracks/One.wav"></audio>
    </div>

    <div class="containerMusicTrack">
        <h3>Paranoid</h3>
        <h4>Black Sabbath</h4>
        <h4>1970</h4>
        <style>
            #albumCoverParanoid {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverParanoid" src="albumCovers/Black_Sabbath_-_Paranoid.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Rhythm" onclick="toggleIframeAndButtons('iframeParanoidRhythm', 'innerButtonContainerParanoidRhythm', this)">Rhythm</button>
            <!--Split Lead and Rhythm buttons into 2 containers-->
            <div id="innerButtonContainerParanoidRhythm" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeParanoidRhythm', 0.5, 'rhythmParanoid', [
                    { tempoChangePageID: 'oneTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'twoTempoChange', tempoChangeSpeed: 0.5 },
                    { tempoChangePageID: 'threeTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'fourTempoChange', tempoChangeSpeed: 0.5 },
                    { tempoChangePageID: 'fiveTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'sixTempoChange', tempoChangeSpeed: 0.5 },
                    { tempoChangePageID: 'sevenTempoChange', tempoChangeSpeed: 1.0 },
                    { tempoChangePageID: 'eightTempoChange', tempoChangeSpeed: 0.5 }
                ])">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling('rhythmParanoid')">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeParanoidRhythm', 'rhythmParanoid')">Reset</button>
            </div>
        </div>
        <iframe id="iframeParanoidRhythm" class="containerIFrame" src="tabs/ParanoidRhythm.html" alt="Tab Is Not Available"></iframe>
        <audio id="rhythmParanoid" src="backing-tracks/Paranoid-Rhythm.wav"></audio>
    </div>
    <script src="script.js" async defer></script>
</body>

</html>
