<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <h1 class="mainHeader">
        Log In
        <button id="buttonLogout" style="display: none;">Logout</button>
    </h1>

    <div id="warning" style="display: none;">
        Your screen width is too small for optimal viewing.
        <button id="buttonWarningClose">Close</button>
    </div>

    <nav class="mainNav">
        <ul>
            <li><a href="/favorites">Favorites</a></li>
            <li><a href="/catalog">Catalog</a></li>
            <li><a href="/gallery">Guitar Gallery</a></li>
        </ul>
    </nav>

    <!-- Login Form -->
    <form id="login-form">
        <h2>Login</h2>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        
        <button type="submit">Login</button>
    </form>
    <div id="error-message" style="color: red;"></div>

    <!-- User Registration Form -->
    <form id="user-form">
        <h2>Create an Account</h2>
        <label for="username">Username:</label>
        <input type="text" id="register-username" name="username" required>
        
        <label for="password">Password:</label>
        <input type="password" id="register-password" name="password" required>
        
        <button type="button" id="add-user-btn">Create Account</button>
    </form>
    <div id="registration-error-message" style="color: red;"></div>
    
    <script src="scriptLogin.js"></script>
    <script src="scriptLogout.js"></script>
</body>

</html>
