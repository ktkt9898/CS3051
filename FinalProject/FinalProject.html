<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Guitar Tabs</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- Your web page content goes here -->
    <h1 class="customHeader"> Guitar Tabs </h1>
    <div id="customHeader"></div>
    <select id="alphabetSelection">
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
      <option value="E">E</option>
      <option value="F">F</option>
      <option value="G">G</option>
      <option value="H">H</option>
      <option value="I">I</option>
      <option value="J">J</option>
      <option value="K">K</option>
      <option value="L">L</option>
      <option value="M">M</option>
      <option value="N">N</option>
      <option value="O">O</option>
      <option value="P">P</option>
      <option value="Q">Q</option>
      <option value="R">R</option>
      <option value="S">S</option>
      <option value="T">T</option>
      <option value="U">U</option>
      <option value="V">V</option>
      <option value="W">W</option>
      <option value="X">X</option>
      <option value="Y">Y</option>
      <option value="Z">Z</option>
    </select>
    <div class="myContainer">
        <div class="guitarTab">
            <h2>Smoke on the Water</h2>
            <button class="tabButton" onclick="toggleIframe('iframeSmoke')">Show/Hide</button>
            <iframe id="iframeSmoke" class="customIFrame" src="tabs/Smoke.html" alt="Tab Is Not Available"></iframe>
          </div>
        <div class="guitarTab">
            <h2>Stairway to Heaven</h2>
            <button class="tabButton" onclick="toggleIframe('iframeStairway')">Show/Hide</button>
            <iframe id="iframeStairway" class="customIFrame" src="tabs/Stairway.png" alt="Tab Is Not Available"></iframe>
          </div>
    <script src="script.js" async defer></script>
</body>

</html>
