<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Guitar Tabs</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- Your web page content goes here -->
    <h1 class="mainHeader"> Guitar Tabs </h1>

    <div class="containerMusicTrack">
        <h3>Stairway to Heaven</h3>
        <h4>Led Zeppelin</h4>
        <h4>1971</h4>
        <style>
            #albumCoverStairway {
                width: 100px;
                border: 5px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverStairway" src="albumCovers/Led_Zeppelin_IV.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" onclick="toggleIframeAndButtons('iframeStairway', 'innerButtonContainerStairway', this)">Show</button>
            <div id="innerButtonContainerStairway" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeStairway', 1.25)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeStairway')">Reset</button>
            </div>
        </div>
        <iframe id="iframeStairway" class="containerIFrame" src="tabs/Stairway.html" alt="Tab Is Not Available"></iframe>
    </div>

    <div class="containerMusicTrack">
        <h3>One</h3>
        <h4>Metallica</h4>
        <h4>1988</h4>
        <style>
            #albumCoverOne {
                width: 100px;
                border: 5px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverOne" src="albumCovers/Metallica_-_...And_Justice_for_All_cover.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" onclick="toggleIframeAndButtons('iframeOne', 'innerButtonContainerOne', this)">Show</button>
            <div id="innerButtonContainerOne" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrollingWithTempoChange('iframeOne', 2)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeOne')">Reset</button>
            </div>
        </div>
        <iframe id="iframeOne" class="containerIFrame" src="tabs/One.html" alt="Tab Is Not Available"></iframe>
    </div>

    <div class="containerMusicTrack">
        <h3>Paranoid</h3>
        <h4>Black Sabbath</h4>
        <h4>1970</h4>
        <style>
            #albumCoverParanoid {
                width: 100px;
                border: 5px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverParanoid" src="albumCovers/Black_Sabbath_-_Paranoid.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" onclick="toggleIframeAndButtons('iframeParanoid', 'containerInnerButtonsParanoid', this)">Show</button>
            <div id="containerInnerButtonsParanoid" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeParanoid', 1.3)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeParanoid')">Reset</button>
            </div>
        </div>
        <iframe id="iframeParanoid" class="containerIFrame" src="tabs/Paranoid.html" alt="Tab Is Not Available"></iframe>
    </div>
    <script src="script.js" async defer></script>
</body>

</html>
