<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Guitar Tabs</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- Your web page content goes here -->
    <h1 class="customHeader"> Guitar Tabs </h1>

    <div class="tabContainer">
        <div class="guitarTab">
            <h3>Stairway to Heaven</h3>
            <h4>Led Zeppelin</h4>
            <h4>1971</h4>
            <style>
                #albumCoverStairway {
                    width: 100px;
                    border: 5px solid black;
                    box-sizing: border-box;
                    float: left
                }
            </style>
            <div class="albumContainer">
                <img id="albumCoverStairway" src="albumCovers/Led_Zeppelin_IV.jpg" alt="Album Cover"></img>
            </div>
            <div class="buttonContainer">
                <button class="tabButton" onclick="toggleIframeAndButtons('iframeStairway', 'innerButtonContainerStairway', this)">Show</button>
                <div id="innerButtonContainerStairway" class="innerButtonContainer" style="display: none;">
                    <button class="scrollButton" onclick="startScrolling('iframeStairway', 1.5)">Start Scrolling</button>
                    <button class="scrollButton" onclick="stopScrolling()">Stop Scrolling</button>
                    <button class="scrollButton" onclick="restartScrolling('iframeStairway')">Restart</button>
                </div>
            </div>
            <iframe id="iframeStairway" class="customIFrame" src="tabs/Stairway.html" alt="Tab Is Not Available"></iframe>
        </div>
    </div>
</body>
