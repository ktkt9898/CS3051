<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Guitar Tabs</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- Your web page content goes here -->
    <h1 class="customHeader"> Guitar Tabs </h1>
    <div class="customDropdown">
      <div class="dropdownButtonHeader">Search By Letter</div>
      <div class="dropdownContent">
          <div class="dropdownOption" data-value="A">A</div>
          <div class="dropdownOption" data-value="B">B</div>
          <div class="dropdownOption" data-value="C">C</div>
          <div class="dropdownOption" data-value="D">D</div>
          <div class="dropdownOption" data-value="E">E</div>
          <div class="dropdownOption" data-value="F">F</div>
          <div class="dropdownOption" data-value="G">G</div>
          <div class="dropdownOption" data-value="H">H</div>
          <div class="dropdownOption" data-value="I">I</div>
          <div class="dropdownOption" data-value="J">J</div>
          <div class="dropdownOption" data-value="K">K</div>
          <div class="dropdownOption" data-value="L">L</div>
          <div class="dropdownOption" data-value="M">M</div>
          <div class="dropdownOption" data-value="N">N</div>
          <div class="dropdownOption" data-value="O">O</div>
          <div class="dropdownOption" data-value="P">P</div>
          <div class="dropdownOption" data-value="Q">Q</div>
          <div class="dropdownOption" data-value="R">R</div>
          <div class="dropdownOption" data-value="S">S</div>
          <div class="dropdownOption" data-value="T">T</div>
          <div class="dropdownOption" data-value="U">U</div>
          <div class="dropdownOption" data-value="V">V</div>
          <div class="dropdownOption" data-value="W">W</div>
          <div class="dropdownOption" data-value="X">X</div>
          <div class="dropdownOption" data-value="Y">Y</div>
          <div class="dropdownOption" data-value="Z">Z</div>
      </div>
  </div>
  <div class="myContainer">
    <div class="guitarTab">
        <h2>Smoke on the Water</h2>
        <button class="tabButton" onclick="toggleIframeAndButtons('iframe', 'innerButtonContainer')">Show/Hide</button>
        <div id="innerButtonContainer" class="innerButtonContainer" style="display: none;">
            <button class="scrollButton" onclick="startScrolling('iframe')">Start Scrolling</button>
            <button class="scrollButton" onclick="stopScrolling()">Stop Scrolling</button>
            <button class="scrollButton" onclick="restartScrolling('iframe')">Restart Scrolling</button>
            <iframe id="iframe" class="customIFrame" src="tabs/Smoke.html" alt="Tab Is Not Available"></iframe>
        </div>
    </div>
    <script src="script.js" async defer></script>
</body>

</html>
