<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Guitar Tabs</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- Your web page content goes here -->
    <h1 class="mainHeader"> Guitar Tabs </h1>

    <div class="containerMusicTrack">
        <h3>Stairway to Heaven</h3>
        <h4>Led Zeppelin</h4>
        <h4>1971</h4>
        <style>
            #albumCoverStairway {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverStairway" src="albumCovers/Led_Zeppelin_IV.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Lead" onclick="toggleIframeAndButtons('iframeStairway', 'innerButtonContainerStairway', this)">Lead</button>
            <button class="buttonShow" data-original-text="Rhythm" onclick="toggleIframeAndButtons('iframeStairway', 'innerButtonContainerStairway', this)">Rhythm</button>
            <div id="innerButtonContainerStairway" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeStairway', 1.25)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeStairway')">Reset</button>
            </div>
        </div>
        <iframe id="iframeStairway" class="containerIFrame" src="tabs/Stairway.html" alt="Tab Is Not Available"></iframe>
    </div>

    <div class="containerMusicTrack">
        <h3>One</h3>
        <h4>Metallica</h4>
        <h4>1988</h4>
        <style>
            #albumCoverOne {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverOne" src="albumCovers/Metallica_-_...And_Justice_for_All_cover.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Lead" onclick="toggleIframeAndButtons('iframeOneLead', 'innerButtonContainerOneLead', this)">Lead</button>
            <button class="buttonShow" data-original-text="Rhythm" onclick="toggleIframeAndButtons('iframeOneRhythm', 'innerButtonContainerOneRhythm', this)">Rhythm</button>
            <div class="containerButton">
                <!--Split Lead and Rhythm buttons into 2 containers-->
                <div id="innerButtonContainerOneLead" class="containerInnerButtons" style="display: none;">
                    <button class="buttonsInner" onclick="startScrollingWithTempoChange('iframeOneLead', 1.1, 'onePg5', 2)">Start</button>
                    <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                    <button class="buttonsInner" onclick="resetScrolling('iframeOneLead')">Reset</button>
                </div>
                
                <div id="innerButtonContainerOneRhythm" class="containerInnerButtons" style="display: none;">
                    <button class="buttonsInner" onclick="startScrollingWithTempoChange('iframeOneRhythm', 1.1, 'onePg10', 2)">Start</button>
                    <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                    <button class="buttonsInner" onclick="resetScrolling('iframeOneRhythm')">Reset</button>
                </div>
            </div>
        </div>
        <iframe id="iframeOneLead" class="containerIFrame" src="tabs/OneLead.html" alt="Tab Is Not Available"></iframe>
        <iframe id="iframeOneRhythm" class="containerIFrame" src="tabs/OneRhythm.html" alt="Tab Is Not Available"></iframe>
    </div>

    <div class="containerMusicTrack">
        <h3>Paranoid</h3>
        <h4>Black Sabbath</h4>
        <h4>1970</h4>
        <style>
            #albumCoverParanoid {
                width: 100px;
                border: 2px solid black;
                box-sizing: border-box;
                float: left
            }
        </style>
        <div class="containerAlbumCover">
            <img id="albumCoverParanoid" src="albumCovers/Black_Sabbath_-_Paranoid.jpg" alt="Album Cover"></img>
        </div>
        <div class="containerButton">
            <button class="buttonShow" data-original-text="Lead" onclick="toggleIframeAndButtons('iframeParanoidLead', 'innerButtonContainerParanoidLead', this)">Lead</button>
            <button class="buttonShow" data-original-text="Rhythm" onclick="toggleIframeAndButtons('iframeParanoidRhythm', 'innerButtonContainerParanoidRhythm', this)">Rhythm</button>
            <!--Split Lead and Rhythm buttons into 2 containers-->
            <div id="innerButtonContainerParanoidLead" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeParanoidLead', 1.1)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeParanoidLead')">Reset</button>
            </div>
            
            <div id="innerButtonContainerParanoidRhythm" class="containerInnerButtons" style="display: none;">
                <button class="buttonsInner" onclick="startScrolling('iframeParanoidRhythm', 1.1)">Start</button>
                <button class="buttonsInner" onclick="pauseScrolling()">Pause</button>
                <button class="buttonsInner" onclick="resetScrolling('iframeParanoidRhythm')">Reset</button>
            </div>
        </div>
        <iframe id="iframeParanoidLead" class="containerIFrame" src="tabs/ParanoidLead.html" alt="Tab Is Not Available"></iframe>
        <iframe id="iframeParanoidRhythm" class="containerIFrame" src="tabs/ParanoidRhythm.html" alt="Tab Is Not Available"></iframe>
    </div>
    <script src="script.js" async defer></script>
</body>

</html>
