<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle's Guitar Tabs</title> <!-- Put your own title here -->
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- Your web page content goes here -->
    <h1 class="customHeader"> Guitar Tabs </h1>
    <div class="myContainer">
        <div class="guitarTab">
            <h2> Smoke on the Water </h2>
            <button class="tabButton" onclick="toggleImage('imageSmoke')"> Show/Hide </button>
            <img id="imageSmoke" src="tabs/Smoke.png" alt="Tab Is Not Available" style="display: none;">
        </div>
        <div class="guitarTab">
            <h2> Stairway to Heaven </h2>
            <button class="tabButton" onclick="toggleImage('imageStairway')"> Show/Hide </button>
            <img id="imageStairway" src="tabs/Stairway.png" alt="Tab Is Not Available" style="display: none;">
        </div>
    <script src="script.js" async defer></script>
</body>

</html>
